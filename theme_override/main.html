{% extends "base.html" %}

 Custom front matter
{% block extrahead %}
  <!-- Extra style sheets (can't be set in mkdocs.yml due to content hash) -->
  <link
    rel="stylesheet"
    href="{{ 'assets/stylesheets/custom.css' | url }}"
  />
{% endblock %}

<!-- Announcement bar -->
{% block announce %}
	<p>
		<strong>We need help for writing this documentation!</strong>
		<br/>
		If you want to contribute, please <a href="https://github.com/xurei/shadertastic-doc/issues/new">Open an Issue on Github</a>
	</p>
{% endblock %}

<!-- Theme-related JavaScript -->
{% block scripts %}
  {{ super() }}

  <!-- Extra JavaScript (can't be set in mkdocs.yml due to content hash) -->
<!--  <script src="{{ 'assets/javascripts/custom.js' | url }}"></script>-->
{% endblock %}
